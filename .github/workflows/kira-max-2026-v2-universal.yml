name: KIRA MAX 2026 V2 Universal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MAX_2026_V2_PREREGISTRATION.md'
      - 'tools/kira_max_2026_v2_universal.py'
      - '.github/workflows/kira-max-2026-v2-universal.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright
      - run: python -m playwright install chromium
      - name: Execute frozen universal MAX 2026 V2 lab
        run: python tools/kira_max_2026_v2_universal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kira-max-2026-v2-universal
          path: artifacts/kira_max_2026_v2
          if-no-files-found: warn
          retention-days: 30
