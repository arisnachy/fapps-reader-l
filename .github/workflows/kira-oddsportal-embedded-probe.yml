name: KIRA OddsPortal Embedded Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_oddsportal_embedded_probe.py'
      - '.github/workflows/kira-oddsportal-embedded-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/kira_oddsportal_embedded_probe.py
