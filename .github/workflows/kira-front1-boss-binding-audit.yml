name: KIRA FRONT1 BOSS Binding Audit
on:
  push:
    paths:
      - '.github/workflows/kira-front1-boss-binding-audit.yml'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Correct event binding offline
        run: python kira_front1_correct_boss_event_binding.py | tee front1_boss_binding_stdout.json
      - name: Persist corrected audit
        run: |
          git config user.name 'kira-coverage-bot'
          git config user.email '127772990+arisnachy@users.noreply.github.com'
          git add front1_football_contract_inventory_v2/boss_event_binding_audit.json front1_boss_binding_stdout.json
          git commit -m "KIRA FRONT1: corrected BOSS event binding $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push
