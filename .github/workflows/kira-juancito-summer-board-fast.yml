name: KIRA Juancito Summer Board Fast

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_summer_board_fast.py'
      - '.github/workflows/kira-juancito-summer-board-fast.yml'

permissions:
  contents: read

jobs:
  summer_board_fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run fast anonymous board scan
        run: python tools/kira_juancito_summer_board_fast.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-summer-board-fast
          path: artifacts/kira_juancito_summer_board_fast
          if-no-files-found: error
          retention-days: 7
