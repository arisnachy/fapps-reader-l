name: KIRA Euro Lower10 Tier-B P055 Common 2025

on:
  push:
    branches: [main]
    paths:
      - 'tools/kira_euro_lower10_tierb_p055_common_2025.py'
      - '.github/workflows/kira-euro-lower10-tierb-p055-common-2025.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python -m py_compile tools/kira_euro_lower10_tierb_p055_common_2025.py
      - name: Reconstruct frozen Lower10 selector without outcomes
        run: python tools/kira_euro_lower10_tierb_p055_common_2025.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-euro-lower10-tierb-p055-common-2025
          path: artifacts/kira_euro_lower10_tierb_p055_common_2025
          if-no-files-found: error
          retention-days: 30
