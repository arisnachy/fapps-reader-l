name: KIRA Juancito NFL Direct Headers
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_nfl_direct_hdr_probe.py'
      - '.github/workflows/kira-juancito-nfl-direct-hdr.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - run: python tools/kira_juancito_nfl_direct_hdr_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-nfl-direct-hdr
          path: artifacts/kira_juancito_nfl_direct_hdr
          if-no-files-found: error
          retention-days: 7
