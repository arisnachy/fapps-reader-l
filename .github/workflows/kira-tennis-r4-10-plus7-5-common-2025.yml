name: KIRA Tennis R4-10 +7.5 Common 2025

on:
  push:
    branches: [main]
    paths:
      - 'tools/kira_tennis_r4_10_plus7_5_common_2025.py'
      - '.github/workflows/kira-tennis-r4-10-plus7-5-common-2025.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pandas openpyxl requests
      - run: python -m py_compile tools/kira_tennis_r4_10_plus7_5_common_2025.py
      - name: Reconstruct exact-date rank-disjoint calendar without result columns
        run: python tools/kira_tennis_r4_10_plus7_5_common_2025.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-tennis-r4-10-plus7-5-common-2025
          path: artifacts/kira_tennis_r4_10_plus7_5_common_2025
          if-no-files-found: error
          retention-days: 30
