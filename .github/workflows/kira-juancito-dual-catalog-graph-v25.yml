name: KIRA Juancito Dual Public Catalog Graph V25
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/kira_juancito_dual_catalog_graph_v20.py'
      - 'tools/kira_juancito_dual_catalog_graph_v21.py'
      - 'tools/kira_juancito_dual_catalog_graph_v23.py'
      - 'tools/kira_juancito_dual_catalog_graph_v24.py'
      - 'tools/kira_juancito_dual_catalog_graph_v25.py'
      - '.github/workflows/kira-juancito-dual-catalog-graph-v25.yml'
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Compile separated board graph stack
        run: |
          python -m py_compile tools/kira_juancito_dual_catalog_graph_v20.py
          python -m py_compile tools/kira_juancito_dual_catalog_graph_v21.py
          python -m py_compile tools/kira_juancito_dual_catalog_graph_v23.py
          python -m py_compile tools/kira_juancito_dual_catalog_graph_v24.py
          python -m py_compile tools/kira_juancito_dual_catalog_graph_v25.py
      - name: Run dual public catalog with exact-event entries deferred
        run: python tools/kira_juancito_dual_catalog_graph_v25.py
      - name: Upload dual catalog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-dual-catalog-graph-v25
          path: artifacts/kira_juancito_dual_catalog_graph_v25
          if-no-files-found: warn
          retention-days: 7
