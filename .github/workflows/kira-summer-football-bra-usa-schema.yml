name: KIRA Summer Football BRA USA Schema
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_summer_football_bra_usa_schema_probe.py'
      - '.github/workflows/kira-summer-football-bra-usa-schema.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python tools/kira_summer_football_bra_usa_schema_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-summer-football-bra-usa-schema
          path: artifacts/kira_summer_football_bra_usa_schema
          if-no-files-found: error
          retention-days: 30
