name: KIRA WNBA C3 Calendar 2025

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_wnba_c3_calendar_2025.py'
      - '.github/workflows/kira-wnba-c3-calendar-2025.yml'

permissions:
  contents: read

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy pandas pyarrow requests
      - name: Reconstruct frozen WNBA C3 calendar without target outcomes
        run: python tools/kira_wnba_c3_calendar_2025.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-wnba-c3-calendar-2025
          path: artifacts/kira_wnba_c3_calendar_2025
          if-no-files-found: error
          retention-days: 30
