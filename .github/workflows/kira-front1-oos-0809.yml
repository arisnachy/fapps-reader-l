name: KIRA FRONT1 OOS 0809 TEMP
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kira-front1-oos-0809.yml'
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute frozen scorer
        run: python kira_front1_oos_0809.py
      - name: Persist public non-sensitive result
        run: |
          git config user.name 'kira-science-bot'
          git config user.email 'kira-science-bot@users.noreply.github.com'
          git add out
          git commit -m 'KIRA TEMP: persist frozen Football OOS 0809 outputs'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: kira-front1-oos-0809
          path: out
          retention-days: 1
