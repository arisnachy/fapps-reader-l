name: KIRA DAILY CORE Football Common Window 2025

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kira-daily-core-football-common-2025.yml'

permissions:
  contents: read

jobs:
  football_common_window:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime
        run: python -m pip install --disable-pip-version-check pandas requests

      - name: Reconstruct terminal-PASS football candidates without outcomes
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import csv
          import hashlib
          import io
          import json
          import math
          from collections import Counter
          from datetime import datetime, date, timedelta
          from pathlib import Path

          import pandas as pd
          import requests

          OUT = Path('artifacts/kira_daily_core_football_common_2025')
          OUT.mkdir(parents=True, exist_ok=True)
          LEAGUES = ['E0','SP1','D1','I1','F1','N1','P1','SC0','B1']
          SEASONS = ['2425','2526']
          WINDOW_START = date(2024,12,27)
          WINDOW_END = date(2025,12,17)
          REQUIRED = ['Date','HomeTeam','AwayTeam','B365H','B365D','B365A']

          def parse_date(value):
              text = str(value).strip()
              for fmt in ('%d/%m/%y','%d/%m/%Y'):
                  try:
                      return datetime.strptime(text, fmt).date()
                  except ValueError:
                      pass
              return None

          source_audit=[]
          valid_rows=[]
          session=requests.Session()
          session.headers.update({'User-Agent':'KIRA-readonly-coverage-audit/1.0'})
          for season in SEASONS:
              for league in LEAGUES:
                  url=f'https://www.football-data.co.uk/mmz4281/{season}/{league}.csv'
                  r=session.get(url, timeout=30)
                  if r.status_code != 200:
                      raise SystemExit(f'SOURCE_MISSING {url} HTTP {r.status_code}')
                  raw=r.content
                  sha=hashlib.sha256(raw).hexdigest()
                  parsed=None
                  encoding_used=None
                  for enc in ('utf-8-sig','latin-1'):
                      try:
                          parsed=pd.read_csv(io.BytesIO(raw), encoding=enc)
                          encoding_used=enc
                          break
                      except UnicodeDecodeError:
                          continue
                  if parsed is None:
                      raise SystemExit(f'UNREADABLE_SOURCE {url}')
                  missing=[c for c in REQUIRED if c not in parsed.columns]
                  if missing:
                      raise SystemExit(f'REQUIRED_COLUMNS_MISSING {url} {missing}')
                  accepted=0
                  bad_date=0
                  bad_odds=0
                  for _,row in parsed.iterrows():
                      d=parse_date(row['Date'])
                      if d is None:
                          bad_date += 1
                          continue
                      if not (WINDOW_START <= d <= WINDOW_END):
                          continue
                      try:
                          h=float(row['B365H']); dr=float(row['B365D']); a=float(row['B365A'])
                      except (TypeError,ValueError):
                          bad_odds += 1
                          continue
                      if not all(math.isfinite(x) and x>1.0 for x in (h,dr,a)):
                          bad_odds += 1
                          continue
                      home=str(row['HomeTeam']).strip(); away=str(row['AwayTeam']).strip()
                      if not home or not away or home.lower()=='nan' or away.lower()=='nan':
                          continue
                      qh,qd,qa=1/h,1/dr,1/a
                      denom=qh+qd+qa
                      ph,pd,pa=qh/denom,qd/denom,qa/denom
                      valid_rows.append({
                          'date':d.isoformat(),'season':season,'league_code':league,
                          'HomeTeam':home,'AwayTeam':away,
                          'B365H':h,'B365D':dr,'B365A':a,
                          'p_home_novig':ph,'p_draw_novig':pd,'p_away_novig':pa,
                      })
                      accepted += 1
                  source_audit.append({
                      'season':season,'league_code':league,'url':url,
                      'bytes':len(raw),'sha256':sha,'raw_rows':len(parsed),
                      'accepted_pregame_rows_in_window':accepted,
                      'bad_date_rows_all_source':bad_date,'bad_odds_rows_in_window':bad_odds,
                      'encoding':encoding_used,
                  })

          # Fail closed on duplicate source event identity after normalized load.
          event_keys=[(r['date'],r['league_code'],r['HomeTeam'],r['AwayTeam']) for r in valid_rows]
          dup=[k for k,n in Counter(event_keys).items() if n>1]
          if dup:
              raise SystemExit(f'DUPLICATE_EVENT_KEYS {len(dup)} first={dup[:5]}')

          def event_id(prefix,r):
              payload='|'.join([r['date'],r['league_code'],r['HomeTeam'],r['AwayTeam']])
              return prefix+'-'+hashlib.sha256(payload.encode()).hexdigest()[:20]

          # Frozen HOME +1.5 Market Dominance selector: p_home >= .75, one highest/date.
          home_by_date={}
          for r in valid_rows:
              if r['p_home_novig'] >= 0.75:
                  home_by_date.setdefault(r['date'],[]).append(r)
          home_selected=[]
          for d,items in sorted(home_by_date.items()):
              s=sorted(items,key=lambda r:(-r['p_home_novig'],r['B365H'],r['league_code'],r['HomeTeam'],r['AwayTeam']))[0]
              home_selected.append({
                  **s,'strategy_id':'FOOTBALL_PLUS1_5_MARKET_DOMINANCE_V1','sport':'football',
                  'event_id':event_id('FHIST',s),'selected_entity':s['HomeTeam'],'opponent':s['AwayTeam'],
                  'selected_side':'HOME','frozen_line':1.5,'science_state':'SCIENCE/CERTAINTY PASS',
                  'sports_candidate_frozen':True,'correlation_cluster':'CORRELATED_FOOTBALL_CLUSTER','cluster_cap_one':True,
              })

          # Frozen favorite +0.5 selector: unique H/A favorite, p_favorite >= .60, one highest/date.
          fav_by_date={}
          for r in valid_rows:
              ph,pa=r['p_home_novig'],r['p_away_novig']
              if ph == pa:
                  continue
              side='HOME' if ph>pa else 'AWAY'
              pf=max(ph,pa)
              if pf < 0.60:
                  continue
              item=dict(r)
              item['p_favorite_novig']=pf
              item['selected_side']=side
              item['selected_side_price']=r['B365H'] if side=='HOME' else r['B365A']
              item['selected_entity']=r['HomeTeam'] if side=='HOME' else r['AwayTeam']
              item['opponent']=r['AwayTeam'] if side=='HOME' else r['HomeTeam']
              fav_by_date.setdefault(r['date'],[]).append(item)
          fav_selected=[]
          for d,items in sorted(fav_by_date.items()):
              s=sorted(items,key=lambda r:(-r['p_favorite_novig'],r['selected_side_price'],r['league_code'],r['HomeTeam'],r['AwayTeam'],r['selected_side']))[0]
              fav_selected.append({
                  **s,'strategy_id':'FOOTBALL_PLUS0_5_MARKET_FAVORITE_V1','sport':'football',
                  'event_id':event_id('FHIST',s),'frozen_line':0.5,'science_state':'SCIENCE/CERTAINTY PASS',
                  'sports_candidate_frozen':True,'correlation_cluster':'CORRELATED_FOOTBALL_CLUSTER','cluster_cap_one':True,
              })

          # Coverage uses pregame availability only; no score/outcome column was loaded or referenced.
          home_map={r['date']:r for r in home_selected}
          fav_map={r['date']:r for r in fav_selected}
          active_dates=set(r['date'] for r in valid_rows)
          all_days=[]
          d=WINDOW_START
          while d<=WINDOW_END:
              ds=d.isoformat(); h=home_map.get(ds); f=fav_map.get(ds)
              if h and f:
                  state='BOTH_SAME_EVENT' if h['event_id']==f['event_id'] else 'BOTH_DIFFERENT_EVENTS_CORRELATED_CLUSTER'
              elif h: state='HOME_ONLY'
              elif f: state='FAVORITE_ONLY'
              else: state='NEITHER'
              all_days.append({
                  'date':ds,'match_active':ds in active_dates,'football_state':state,
                  'home_candidate_event_id':h['event_id'] if h else '',
                  'favorite_candidate_event_id':f['event_id'] if f else '',
                  'raw_distinct_football_events':len(set(x for x in [h['event_id'] if h else '',f['event_id'] if f else ''] if x)),
                  'conservative_football_legs':1 if (h or f) else 0,
              })
              d += timedelta(days=1)

          def write_csv(name,rows):
              path=OUT/name
              if not rows:
                  path.write_text('',encoding='utf-8'); return
              keys=[]
              for r in rows:
                  for k in r:
                      if k not in keys: keys.append(k)
              with path.open('w',newline='',encoding='utf-8') as fh:
                  w=csv.DictWriter(fh,fieldnames=keys); w.writeheader(); w.writerows(rows)

          write_csv('football_home_plus1_5_candidates.csv',home_selected)
          write_csv('football_favorite_plus0_5_candidates.csv',fav_selected)
          write_csv('football_daily_coverage.csv',all_days)
          (OUT/'source_audit.json').write_text(json.dumps(source_audit,indent=2,sort_keys=True),encoding='utf-8')

          states=Counter(r['football_state'] for r in all_days)
          active_states=Counter(r['football_state'] for r in all_days if r['match_active'])
          union_days=sum(r['conservative_football_legs'] for r in all_days)
          raw_two=sum(r['raw_distinct_football_events']>=2 for r in all_days)
          summary={
              'audit':'DAILY_CORE_FOOTBALL_COMMON_WINDOW_2025_OUTCOME_BLIND',
              'window_start':WINDOW_START.isoformat(),'window_end':WINDOW_END.isoformat(),
              'calendar_days':len(all_days),'valid_pregame_events':len(valid_rows),
              'source_files':len(source_audit),'source_leagues':LEAGUES,'source_seasons':SEASONS,
              'home_plus1_5_candidate_dates':len(home_selected),
              'favorite_plus0_5_candidate_dates':len(fav_selected),
              'football_union_candidate_dates_conservative':union_days,
              'football_union_calendar_coverage_pct':100*union_days/len(all_days),
              'calendar_states':states,
              'match_active_dates':sum(r['match_active'] for r in all_days),
              'active_date_states':active_states,
              'dates_with_two_raw_distinct_football_events':raw_two,
              'correlation_policy':'both PASS football strategies belong to CORRELATED_FOOTBALL_CLUSTER and count max one conservative leg/date',
              'outcome_columns_loaded_or_used':False,
              'selector_rules':{
                  'HOME_PLUS1_5':'HOME p_home_novig>=0.75; highest p/date; lower B365H then league/home/away tie-break',
                  'FAVORITE_PLUS0_5':'unique HOME/AWAY favorite p>=0.60; highest p/date; lower selected-side price then league/home/away/side tie-break'
              }
          }
          (OUT/'summary.json').write_text(json.dumps(summary,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload outcome-blind common-window evidence
        uses: actions/upload-artifact@v4
        with:
          name: kira-daily-core-football-common-2025
          path: artifacts/kira_daily_core_football_common_2025
          if-no-files-found: error
          retention-days: 30
