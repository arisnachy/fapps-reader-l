name: KIRA Football MULTI3 0304

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_football_multi3_0304.py'
      - '.github/workflows/kira-football-multi3-0304.yml'

permissions:
  contents: read

jobs:
  multi3_0304:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check pandas requests
      - name: Execute frozen MULTI3 validation
        run: python tools/kira_football_multi3_0304.py
      - name: Upload complete evidence
        uses: actions/upload-artifact@v4
        with:
          name: kira-football-multi3-0304
          path: artifacts/kira_football_multi3_0304
          if-no-files-found: error
          retention-days: 30
