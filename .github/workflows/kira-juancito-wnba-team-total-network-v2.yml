name: KIRA Juancito WNBA Team Total Network V2

on:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_wnba_team_total_network_probe_v2.py'
      - '.github/workflows/kira-juancito-wnba-team-total-network-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Probe public WNBA parent control and network
        run: python tools/kira_juancito_wnba_team_total_network_probe_v2.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-wnba-team-total-network-v2
          path: artifacts/kira_juancito_wnba_team_total_network_v2
          if-no-files-found: error
          retention-days: 7
