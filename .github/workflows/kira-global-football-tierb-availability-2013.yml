name: KIRA Global Football TierB Availability 2013
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_global_football_tierb_availability_2013.py'
      - '.github/workflows/kira-global-football-tierb-availability-2013.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python tools/kira_global_football_tierb_availability_2013.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-global-football-tierb-availability-2013
          path: artifacts/kira_global_football_tierb_availability_2013
          if-no-files-found: error
          retention-days: 30
