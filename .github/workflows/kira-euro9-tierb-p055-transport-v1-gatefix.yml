name: KIRA Euro9 Tier-B P055 V1 Gatefix

on:
  push:
    branches: [main]
    paths:
      - 'tools/kira_euro9_tierb_p055_transport_v1_gatefix.py'
      - '.github/workflows/kira-euro9-tierb-p055-transport-v1-gatefix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gatefix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python -m py_compile tools/kira_euro9_tierb_p055_transport_v1.py tools/kira_euro9_tierb_p055_transport_v1_gatefix.py
      - name: Reproduce DEV ledger then open sealed OOS only after corrected PASS
        working-directory: tools
        run: python kira_euro9_tierb_p055_transport_v1_gatefix.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-euro9-tierb-p055-transport-v1-gatefix
          path: tools/artifacts/kira_euro9_tierb_p055_transport_v1_gatefix
          if-no-files-found: error
          retention-days: 30
