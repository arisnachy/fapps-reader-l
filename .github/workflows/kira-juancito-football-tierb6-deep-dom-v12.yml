name: KIRA Juancito Football TierB6 Deep DOM V12
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_football_tierb6_deep_dom_v12.py'
      - '.github/workflows/kira-juancito-football-tierb6-deep-dom-v12.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Deep read-only DOM probe
        run: python tools/kira_juancito_football_tierb6_deep_dom_v12.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kira-juancito-football-tierb6-deep-dom-v12
          path: artifacts/kira_juancito_football_tierb6_deep_dom_v12
          if-no-files-found: warn
          retention-days: 7
