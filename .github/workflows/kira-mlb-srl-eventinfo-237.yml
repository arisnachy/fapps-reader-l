name: KIRA MLB SRL EventInfo 237
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_mlb_srl_eventinfo_237.py'
      - '.github/workflows/kira-mlb-srl-eventinfo-237.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - run: python tools/kira_mlb_srl_eventinfo_237.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-mlb-srl-eventinfo-237
          path: artifacts/kira_mlb_srl_eventinfo_237
          if-no-files-found: error
          retention-days: 7
