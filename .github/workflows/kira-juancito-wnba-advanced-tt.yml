name: KIRA Juancito WNBA Advanced Team Total

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_wnba_advanced_team_total_probe.py'
      - '.github/workflows/kira-juancito-wnba-advanced-tt.yml'

permissions:
  contents: read

jobs:
  wnba_advanced_tt:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Probe WNBA Advanced Props read-only
        run: python tools/kira_juancito_wnba_advanced_team_total_probe.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-wnba-advanced-tt
          path: artifacts/kira_juancito_wnba_advanced_tt
          if-no-files-found: error
          retention-days: 7
