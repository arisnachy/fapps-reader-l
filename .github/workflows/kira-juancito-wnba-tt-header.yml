name: KIRA Juancito WNBA Team Total Header

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_wnba_team_total_header_probe.py'
      - '.github/workflows/kira-juancito-wnba-tt-header.yml'

permissions:
  contents: read

jobs:
  wnba_tt_header:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Click Team Total header read-only and capture ladder
        run: python tools/kira_juancito_wnba_team_total_header_probe.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-wnba-tt-header
          path: artifacts/kira_juancito_wnba_tt_header
          if-no-files-found: error
          retention-days: 7
