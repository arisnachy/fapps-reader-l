name: KIRA Juancito SRL Period Settlement V27
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/kira_juancito_srl_period_settlement_v27.py'
      - '.github/workflows/kira-juancito-srl-period-settlement-v27.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Compile
        run: python -m py_compile tools/kira_juancito_srl_period_settlement_v27.py
      - name: Capture official Juancito MLB SRL period and settlement evidence
        run: python tools/kira_juancito_srl_period_settlement_v27.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-srl-period-settlement-v27
          path: artifacts/kira_juancito_srl_period_settlement_v27
          if-no-files-found: warn
          retention-days: 7
