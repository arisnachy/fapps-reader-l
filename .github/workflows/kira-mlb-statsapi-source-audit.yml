name: KIRA MLB StatsAPI Source Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_mlb_statsapi_source_audit.py'
      - '.github/workflows/kira-mlb-statsapi-source-audit.yml'

permissions:
  contents: read

jobs:
  source_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Audit source transport without reading scores
        run: python tools/kira_mlb_statsapi_source_audit.py
      - name: Upload source identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: kira-mlb-statsapi-source-audit
          path: artifacts/kira_mlb_statsapi_source_audit
          if-no-files-found: error
          retention-days: 30
