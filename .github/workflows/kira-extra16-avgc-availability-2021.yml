name: KIRA Extra16 AvgC Availability 2021
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_extra16_avgc_availability_2021.py'
      - '.github/workflows/kira-extra16-avgc-availability-2021.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python tools/kira_extra16_avgc_availability_2021.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-extra16-avgc-availability-2021
          path: artifacts/kira_extra16_avgc_availability_2021
          if-no-files-found: error
          retention-days: 30
