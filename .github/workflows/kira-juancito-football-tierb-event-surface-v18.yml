name: KIRA Juancito Football TierB Event Surface V18
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/kira_juancito_football_tierb_event_surface_v18.py'
      - '.github/workflows/kira-juancito-football-tierb-event-surface-v18.yml'
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Certify Tier-B target event public surfaces
        run: python tools/kira_juancito_football_tierb_event_surface_v18.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-football-tierb-event-surface-v18
          path: artifacts/kira_juancito_football_tierb_event_surface_v18
          if-no-files-found: warn
          retention-days: 7
