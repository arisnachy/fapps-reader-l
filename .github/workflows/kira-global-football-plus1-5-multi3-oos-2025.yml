name: KIRA Global Football +1.5 MULTI3 OOS 2025
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_global_football_plus1_5_multi3_oos_2025.py'
      - '.github/workflows/kira-global-football-plus1-5-multi3-oos-2025.yml'
permissions:
  contents: read
jobs:
  oos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Execute frozen global Football OOS
        run: python tools/kira_global_football_plus1_5_multi3_oos_2025.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-global-football-plus1-5-multi3-oos-2025
          path: artifacts/kira_global_football_plus1_5_multi3_oos_2025
          if-no-files-found: error
          retention-days: 30
