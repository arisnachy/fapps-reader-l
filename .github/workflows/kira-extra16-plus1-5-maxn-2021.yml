name: KIRA Extra16 +1.5 MAX-N 2021

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MAXN_EXTRA16_PLUS1_5_2021_PREREGISTRATION.md'
      - 'tools/kira_extra16_plus1_5_maxn_2021.py'
      - '.github/workflows/kira-extra16-plus1-5-maxn-2021.yml'

permissions:
  contents: read

jobs:
  stress_test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Execute preregistered MAX-N 3-7 stress test
        run: python tools/kira_extra16_plus1_5_maxn_2021.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kira-extra16-plus1-5-maxn-2021
          path: artifacts/kira_extra16_plus1_5_maxn_2021
          if-no-files-found: error
          retention-days: 30
