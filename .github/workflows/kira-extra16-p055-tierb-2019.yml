name: KIRA Extra16 p055 TierB 2019
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_extra16_favorite_plus1_5_multi3_tierb_p055_2019.py'
      - '.github/workflows/kira-extra16-p055-tierb-2019.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Execute frozen Tier-B one-shot 2019 scoring
        run: python tools/kira_extra16_favorite_plus1_5_multi3_tierb_p055_2019.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-extra16-p055-tierb-2019
          path: artifacts/kira_extra16_favorite_plus1_5_multi3_tierb_p055_2019
          if-no-files-found: error
          retention-days: 30
