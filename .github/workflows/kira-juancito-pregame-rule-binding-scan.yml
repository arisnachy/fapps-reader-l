name: KIRA Juancito Pregame Rule Binding Scan

on:
  push:
    paths:
      - '.github/workflows/kira-juancito-pregame-rule-binding-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan_public_pregame_binding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Scan public pregame surface for rules/help binding
        shell: python
        run: |
          import hashlib, json, re, requests
          from pathlib import Path
          from urllib.parse import urljoin, urlparse
          from bs4 import BeautifulSoup

          START='https://deportes.juancitosport.com.do/BOSSWagering/Sportsbook/InternetBetTaker/'
          OUT=Path('artifacts/pregame_rule_binding'); OUT.mkdir(parents=True,exist_ok=True)
          S=requests.Session(); S.headers['User-Agent']='Mozilla/5.0 KIRA-Juancito-Pregame-Rule-Binding/1.0 read-only'
          r=S.get(START,timeout=45,allow_redirects=True); r.raise_for_status()
          html=r.text
          report={'start':START,'final_url':r.url,'http':r.status_code,'bytes':len(r.content),'sha256':hashlib.sha256(r.content).hexdigest()}
          (OUT/'sportsbook.html').write_text(html,encoding='utf-8',errors='replace')
          soup=BeautifulSoup(html,'html.parser')
          interesting=[]
          patt=re.compile(r'rule|regla|help|ayuda|settle|void|cancel|tennis|wager',re.I)
          for tag in soup.find_all(True):
              vals=[]
              for attr in ('href','src','onclick','title','id','class','data-url','data-href'):
                  v=tag.get(attr)
                  if isinstance(v,list): v=' '.join(v)
                  if v: vals.append(f'{attr}={v}')
              txt=' '.join(tag.stripped_strings)
              blob=' | '.join(vals+[txt])
              if patt.search(blob): interesting.append(blob[:1000])
          report['interesting_html']=interesting[:500]

          scripts=[]
          for s in soup.find_all('script',src=True):
              u=urljoin(r.url,s['src'])
              # stay strictly on Juancito domains
              if not urlparse(u).hostname or not urlparse(u).hostname.endswith('juancitosport.com.do'): continue
              try:
                  rr=S.get(u,timeout=30,allow_redirects=True)
                  rec={'url':u,'http':rr.status_code,'final_url':rr.url,'bytes':len(rr.content),'sha256':hashlib.sha256(rr.content).hexdigest()}
                  if rr.status_code==200:
                      text=rr.text; low=text.casefold()
                      rec['term_counts']={x:low.count(x) for x in ['ruleid','descriptionrule','proprules','rulebook','regla','rules.aspx','wager rules','settlement','void','tennis'] if low.count(x)}
                      snippets=[]
                      for term in ['RuleID','descriptionrule','proprules','ruleBook','Rules.aspx','Reglas','settlement','void']:
                          for m in list(re.finditer(re.escape(term),text,re.I))[:4]:
                              snippets.append(' '.join(text[max(0,m.start()-220):m.end()+420].split()))
                      rec['snippets']=snippets[:40]
                  scripts.append(rec)
              except Exception as exc:
                  scripts.append({'url':u,'error':f'{type(exc).__name__}: {exc}'})
          report['scripts']=scripts
          print('PREGAME_PAGE',json.dumps({k:v for k,v in report.items() if k not in {'interesting_html','scripts'}},sort_keys=True))
          for x in interesting[:100]: print('HTML_MATCH',x)
          for s in scripts:
              if s.get('term_counts') or s.get('error'): print('SCRIPT_MATCH',json.dumps(s,ensure_ascii=False,sort_keys=True))
          (OUT/'report.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
      - name: Upload binding scan
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-pregame-rule-binding-scan
          path: artifacts/pregame_rule_binding
          if-no-files-found: error
          retention-days: 30
