name: KIRA MLB Team Runs Integer V2 DEV 2012
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_mlb_team_runs_integer_v2_dev_2012.py'
      - '.github/workflows/kira-mlb-team-runs-integer-v2-dev-2012.yml'
permissions:
  contents: read
jobs:
  integer_v2_dev:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Execute frozen integer V2 DEV grid
        run: python tools/kira_mlb_team_runs_integer_v2_dev_2012.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: kira-mlb-team-runs-integer-v2-dev-2012
          path: artifacts/kira_mlb_team_runs_integer_v2_dev_2012
          if-no-files-found: error
          retention-days: 30
