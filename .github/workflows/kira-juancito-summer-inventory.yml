name: KIRA Juancito Summer Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_summer_inventory_probe.py'
      - '.github/workflows/kira-juancito-summer-inventory.yml'

permissions:
  contents: read

jobs:
  summer_inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run anonymous read-only summer inventory
        run: python tools/kira_juancito_summer_inventory_probe.py
      - name: Upload sanitized evidence
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-summer-inventory
          path: artifacts/kira_juancito_summer_inventory
          if-no-files-found: error
          retention-days: 7
