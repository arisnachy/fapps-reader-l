name: KIRA MLB Style50 Semantics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_mlb_style50_semantics.py'
      - '.github/workflows/kira-mlb-style50-semantics.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - run: python tools/kira_mlb_style50_semantics.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-mlb-style50-semantics
          path: artifacts/kira_mlb_style50_semantics
          if-no-files-found: error
          retention-days: 7
