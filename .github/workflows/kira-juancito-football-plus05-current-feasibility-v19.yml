name: KIRA Juancito Football Plus05 Current Feasibility V19
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/kira_juancito_football_plus05_current_feasibility_v19.py'
      - '.github/workflows/kira-juancito-football-plus05-current-feasibility-v19.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Audit current same-selected favorite +0.5 main capacity
        run: python tools/kira_juancito_football_plus05_current_feasibility_v19.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-football-plus05-current-feasibility-v19
          path: artifacts/kira_juancito_football_plus05_current_feasibility_v19
          if-no-files-found: warn
          retention-days: 7
