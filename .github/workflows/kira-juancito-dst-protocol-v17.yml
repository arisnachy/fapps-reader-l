name: KIRA Juancito DST Protocol V17
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_dst_protocol_v17.py'
      - '.github/workflows/kira-juancito-dst-protocol-v17.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Inspect sanitized DST protocol read-only
        run: python tools/kira_juancito_dst_protocol_v17.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kira-juancito-dst-protocol-v17
          path: artifacts/kira_juancito_dst_protocol_v17
          if-no-files-found: warn
          retention-days: 7
