name: KIRA Juancito Football Buy Points Global V10
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_football_buy_points_global_v10.py'
      - '.github/workflows/kira-juancito-football-buy-points-global-v10.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Audit full Soccer catalog vs buy-point rules read-only
        run: python tools/kira_juancito_football_buy_points_global_v10.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kira-juancito-football-buy-points-global-v10
          path: artifacts/kira_juancito_football_buy_points_global_v10
          if-no-files-found: warn
          retention-days: 7
