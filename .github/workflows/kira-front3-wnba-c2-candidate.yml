name: KIRA FRONT3 WNBA C2 FROZEN CANDIDATE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'wnba_c2_frozen_candidate_20260811.py'
      - '.github/workflows/kira-front3-wnba-c2-candidate.yml'

permissions:
  contents: read

concurrency:
  group: kira-front3-wnba-c2-frozen-candidate
  cancel-in-progress: true

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic data dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas pyarrow requests
      - name: Reconstruct frozen Aug-11 C2 candidate without target-date outcomes
        run: python wnba_c2_frozen_candidate_20260811.py
      - name: Upload frozen candidate packet
        uses: actions/upload-artifact@v4
        with:
          name: kira-front3-wnba-c2-candidate-20260811
          path: wnba_c2_candidate_20260811.json
          if-no-files-found: error
          retention-days: 3
