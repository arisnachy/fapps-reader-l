name: KIRA Summer16 Opponent TT U3.5 Broad V1

on:
  push:
    branches: [main]
    paths:
      - 'tools/kira_summer16_opponent_tt_u35_broad_v1.py'
      - '.github/workflows/kira-summer16-opponent-tt-u35-broad-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python -m py_compile tools/kira_summer16_opponent_tt_u35_broad_v1.py
      - name: Execute DEV then sealed OOS only after DEV PASS
        run: python tools/kira_summer16_opponent_tt_u35_broad_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-summer16-opponent-tt-u35-broad-v1
          path: artifacts/kira_summer16_opponent_tt_u35_broad_v1
          if-no-files-found: error
          retention-days: 30
