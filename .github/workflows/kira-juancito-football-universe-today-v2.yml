name: KIRA Juancito Football Universe Today V2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_football_universe_today_v2.py'
      - '.github/workflows/kira-juancito-football-universe-today-v2.yml'
permissions:
  contents: read
jobs:
  football_universe_today:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Scan current Juancito BOSS football universe read-only
        run: python tools/kira_juancito_football_universe_today_v2.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-football-universe-today-v2
          path: artifacts/kira_juancito_football_universe_today_v2
          if-no-files-found: error
          retention-days: 7
