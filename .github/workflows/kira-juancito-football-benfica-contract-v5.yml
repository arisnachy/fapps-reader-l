name: KIRA Juancito Football Benfica Contract V5
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_football_benfica_contract_v5.py'
      - '.github/workflows/kira-juancito-football-benfica-contract-v5.yml'
permissions:
  contents: read
jobs:
  benfica_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Probe exact Benfica contract read-only
        run: python tools/kira_juancito_football_benfica_contract_v5.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-football-benfica-contract-v5
          path: artifacts/kira_juancito_football_benfica_contract_v5
          if-no-files-found: error
          retention-days: 7
