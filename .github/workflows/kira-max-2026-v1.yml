name: KIRA MAX 2026 V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MAX_2026_V1_PREREGISTRATION.md'
      - 'tools/kira_max_2026_v1.py'
      - '.github/workflows/kira-max-2026-v1.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Execute frozen MAX 2026 V1 lab
        run: python tools/kira_max_2026_v1.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-max-2026-v1
          path: artifacts/kira_max_2026_v1
          if-no-files-found: error
          retention-days: 30
