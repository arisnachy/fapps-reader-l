name: KIRA Juancito Dual Public Catalog Graph V20
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/kira_juancito_dual_catalog_graph_v20.py'
      - '.github/workflows/kira-juancito-dual-catalog-graph-v20.yml'
jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Compile dual certificate
        run: python -m py_compile tools/kira_juancito_dual_catalog_graph_v20.py
      - name: Run two independent public catalog discoverers
        run: python tools/kira_juancito_dual_catalog_graph_v20.py
      - name: Upload dual catalog evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-dual-catalog-graph-v20
          path: artifacts/kira_juancito_dual_catalog_graph_v20
          if-no-files-found: warn
          retention-days: 7
