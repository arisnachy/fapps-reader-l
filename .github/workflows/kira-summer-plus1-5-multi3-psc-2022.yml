name: KIRA Summer +1.5 MULTI3 Pinnacle 2022
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_summer_plus1_5_multi3_psc_2022.py'
      - '.github/workflows/kira-summer-plus1-5-multi3-psc-2022.yml'
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python tools/kira_summer_plus1_5_multi3_psc_2022.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-summer-plus1-5-multi3-psc-2022
          path: artifacts/kira_summer_plus1_5_multi3_psc_2022
          if-no-files-found: error
          retention-days: 30
