name: KIRA Juancito Football Buy Points Options V8
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_football_buy_points_options_v8.py'
      - '.github/workflows/kira-juancito-football-buy-points-options-v8.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Inspect buy-points live options read-only
        run: python tools/kira_juancito_football_buy_points_options_v8.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kira-juancito-football-buy-points-options-v8
          path: artifacts/kira_juancito_football_buy_points_options_v8
          if-no-files-found: warn
          retention-days: 7
