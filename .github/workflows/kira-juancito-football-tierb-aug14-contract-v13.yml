name: KIRA Juancito Football TierB Aug14 Contract V13
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_football_tierb_aug14_contract_v13.py'
      - '.github/workflows/kira-juancito-football-tierb-aug14-contract-v13.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Probe exact Tier-B selected +1.5 contracts read-only
        run: python tools/kira_juancito_football_tierb_aug14_contract_v13.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kira-juancito-football-tierb-aug14-contract-v13
          path: artifacts/kira_juancito_football_tierb_aug14_contract_v13
          if-no-files-found: warn
          retention-days: 7
