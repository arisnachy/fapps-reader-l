name: KIRA Juancito Baseball Rulebook
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_baseball_prop_rulebook_probe.py'
      - '.github/workflows/kira-juancito-baseball-rulebook.yml'
permissions:
  contents: read
jobs:
  rulebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Probe authoritative rulebook
        run: python tools/kira_juancito_baseball_prop_rulebook_probe.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-baseball-rulebook
          path: artifacts/kira_juancito_baseball_rulebook
          if-no-files-found: error
          retention-days: 7
