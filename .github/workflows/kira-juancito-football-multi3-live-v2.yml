name: KIRA Juancito Football MULTI3 Live V2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_football_multi3_live_probe.py'
      - 'tools/kira_juancito_football_multi3_live_probe_v2.py'
      - '.github/workflows/kira-juancito-football-multi3-live-v2.yml'
permissions:
  contents: read
jobs:
  football_multi3_live_v2:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run current read-only MULTI3 fail-closed on BOSS frame
        working-directory: tools
        run: python kira_juancito_football_multi3_live_probe_v2.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-football-multi3-live-v2
          path: tools/artifacts/kira_juancito_football_multi3_live
          if-no-files-found: error
          retention-days: 7
