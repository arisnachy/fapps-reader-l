name: KIRA NHL Strong Team +1.5 V1

on:
  push:
    branches: [main]
    paths:
      - 'tools/kira_nhl_strong_team_plus1_5_v1.py'
      - '.github/workflows/kira-nhl-strong-team-plus1-5-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python -m py_compile tools/kira_nhl_strong_team_plus1_5_v1.py
      - name: Execute DEV then sealed OOS only after DEV PASS
        run: python tools/kira_nhl_strong_team_plus1_5_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-nhl-strong-team-plus1-5-v1
          path: artifacts/kira_nhl_strong_team_plus1_5_v1
          if-no-files-found: error
          retention-days: 30
