name: KIRA Tennis Exact-Date Calendar Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kira-tennis-calendar-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact_date_join:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check pandas openpyxl requests beautifulsoup4 xlrd
      - name: Build outcome-blind T3 exact-date calendar join
        shell: python
        run: |
          import base64, csv, hashlib, io, json, re, unicodedata, zipfile
          from pathlib import Path
          from urllib.parse import urljoin
          import pandas as pd
          import requests
          from bs4 import BeautifulSoup

          EXPECTED_BLOB = 'b9c0d84ee91691cc10fbe1d56212c39760dddcdb'
          EXPECTED_SHA256 = '78c356ef9328b89ae58a17564d61c02cdad2a3a007f6b8af5cfc17992b11bb2d'
          BLOB_API = f'https://api.github.com/repos/JeffSackmann/tennis_atp/git/blobs/{EXPECTED_BLOB}'
          OUT = Path('artifacts/tennis_calendar')
          OUT.mkdir(parents=True, exist_ok=True)

          def norm(v):
              s = unicodedata.normalize('NFKD', str(v or ''))
              s = ''.join(c for c in s if not unicodedata.combining(c)).casefold()
              s = re.sub(r'[^a-z0-9]+', ' ', s).strip()
              return re.sub(r'\s+', ' ', s)

          def rank(v):
              try:
                  x = int(float(v))
                  return x if x > 0 else None
              except Exception:
                  return None

          session = requests.Session()
          session.headers['User-Agent'] = 'KIRA-Tennis-Calendar-Audit/1.0 read-only'
          r = session.get(BLOB_API, timeout=60)
          r.raise_for_status()
          blob = r.json()
          raw = base64.b64decode(blob['content'])
          assert blob['sha'] == EXPECTED_BLOB
          assert hashlib.sha256(raw).hexdigest() == EXPECTED_SHA256
          print('SOURCE_FINGERPRINT_PASS', len(raw), blob['sha'], hashlib.sha256(raw).hexdigest())

          reader = csv.DictReader(io.StringIO(raw.decode('utf-8-sig')))
          candidates = []
          for row in reader:
              if str(row.get('tourney_level','')).strip().upper() == 'D':
                  continue
              try:
                  if int(float(row.get('best_of') or 0)) != 3:
                      continue
              except Exception:
                  continue
              wr, lr = rank(row.get('winner_rank')), rank(row.get('loser_rank'))
              if wr is None or lr is None:
                  continue
              ws = wr <= 3 and lr >= 11
              ls = lr <= 3 and wr >= 11
              if ws == ls:
                  continue
              selected = row['winner_name'] if ws else row['loser_name']
              opponent = row['loser_name'] if ws else row['winner_name']
              sr = wr if ws else lr
              orank = lr if ws else wr
              candidates.append({
                  'tourney_id': row.get('tourney_id',''),
                  'tourney_name': row.get('tourney_name',''),
                  'tourney_date_anchor': str(row.get('tourney_date','')),
                  'round': row.get('round',''),
                  'selected_player': selected,
                  'selected_rank': sr,
                  'opponent': opponent,
                  'opponent_rank': orank,
                  'pair_key': '||'.join(sorted([norm(selected), norm(opponent)])),
              })
          assert len(candidates) == 115, len(candidates)
          print('T3_PREGAME_CANDIDATES', len(candidates))

          # Tennis-Data publishes a complete zipped ATP season plus individual CSVs.
          index_url = 'https://www.tennis-data.co.uk/alldata.php'
          ir = session.get(index_url, timeout=60)
          ir.raise_for_status()
          soup = BeautifulSoup(ir.text, 'html.parser')
          links = []
          for a in soup.find_all('a', href=True):
              href = a.get('href','')
              text = a.get_text(' ', strip=True)
              if '2025' in href or text == '2025' or '2025' in text:
                  links.append((text, urljoin(index_url, href)))
          print('TENNIS_DATA_2025_LINKS', json.dumps(links[:20]))

          # Prefer season ATP archive link by filename/context; test candidate links until one yields a table with Date/Winner/Loser.
          season_frames = []
          source_urls = []
          candidate_urls = [u for _,u in links]
          seen = set()
          for url in candidate_urls:
              if url in seen: continue
              seen.add(url)
              try:
                  resp = session.get(url, timeout=90)
                  resp.raise_for_status()
                  content = resp.content
                  frames = []
                  if zipfile.is_zipfile(io.BytesIO(content)):
                      with zipfile.ZipFile(io.BytesIO(content)) as z:
                          for name in z.namelist():
                              low=name.lower()
                              try:
                                  b=z.read(name)
                                  if low.endswith('.csv'):
                                      frames.append(pd.read_csv(io.BytesIO(b)))
                                  elif low.endswith(('.xls','.xlsx')):
                                      frames.append(pd.read_excel(io.BytesIO(b)))
                              except Exception:
                                  pass
                  elif url.lower().endswith('.csv'):
                      frames=[pd.read_csv(io.BytesIO(content))]
                  elif url.lower().endswith(('.xls','.xlsx')):
                      frames=[pd.read_excel(io.BytesIO(content))]
                  good=[]
                  for df in frames:
                      cols={str(c).strip().casefold():c for c in df.columns}
                      if all(k in cols for k in ('date','winner','loser')):
                          good.append(df)
                  if good:
                      season_frames.extend(good)
                      source_urls.append(url)
                      # A season archive normally contains all ATP rows; one successful archive is enough.
                      if sum(len(x) for x in season_frames) > 1000:
                          break
              except Exception as exc:
                  print('SOURCE_CANDIDATE_FAIL', url, type(exc).__name__, str(exc)[:160])

          if not season_frames:
              raise SystemExit('NO_TENNIS_DATA_2025_TABLE_WITH_DATE_WINNER_LOSER')
          td = pd.concat(season_frames, ignore_index=True, sort=False)
          cols={str(c).strip().casefold():c for c in td.columns}
          dcol,wcol,lcol=cols['date'],cols['winner'],cols['loser']
          tcol = cols.get('tournament') or cols.get('tourney')
          td['_date'] = pd.to_datetime(td[dcol], errors='coerce', dayfirst=True)
          td['_pair'] = td.apply(lambda x:'||'.join(sorted([norm(x[wcol]),norm(x[lcol])])),axis=1)
          td['_tournament_norm'] = td[tcol].map(norm) if tcol is not None else ''
          print('TENNIS_DATA_ROWS', len(td), 'SOURCE_URLS', json.dumps(source_urls))

          ledger=[]
          for c in candidates:
              anchor=pd.to_datetime(c['tourney_date_anchor'], format='%Y%m%d', errors='coerce')
              hits=td[td['_pair']==c['pair_key']].copy()
              if pd.notna(anchor):
                  hits=hits[(hits['_date'] >= anchor-pd.Timedelta(days=3)) & (hits['_date'] <= anchor+pd.Timedelta(days=18))]
              # If pair repeats in window, tournament-name agreement can disambiguate; never use score/winner orientation.
              if len(hits)>1 and tcol is not None:
                  tn=norm(c['tourney_name'])
                  exact=hits[hits['_tournament_norm']==tn]
                  if len(exact)==1:
                      hits=exact
                  else:
                      contains=hits[hits['_tournament_norm'].map(lambda x: x in tn or tn in x if x and tn else False)]
                      if len(contains)==1: hits=contains
              if len(hits)==1 and pd.notna(hits.iloc[0]['_date']):
                  date=hits.iloc[0]['_date'].date().isoformat()
                  status='EXACT_DATE_JOINED_UNIQUE_PAIR_WINDOW'
                  source_tournament=str(hits.iloc[0][tcol]) if tcol is not None else ''
              else:
                  date=''; status='UNRESOLVED'; source_tournament=''
              ledger.append({**{k:v for k,v in c.items() if k!='pair_key'}, 'exact_match_date':date, 'date_status':status, 'date_source_tournament':source_tournament, 'join_hit_count':int(len(hits))})

          resolved=[x for x in ledger if x['exact_match_date']]
          unresolved=[x for x in ledger if not x['exact_match_date']]
          by_date={}
          for x in resolved:
              by_date.setdefault(x['exact_match_date'],0); by_date[x['exact_match_date']]+=1
          dates=sorted(by_date)
          gaps=[]
          for a,b in zip(dates, dates[1:]):
              da=pd.Timestamp(a); db=pd.Timestamp(b)
              gaps.append({'from':a,'to':b,'gap_days':int((db-da).days),'intervening_days':max(0,int((db-da).days)-1)})
          gaps.sort(key=lambda x:x['gap_days'], reverse=True)
          summary={
              'audit':'T3_EXACT_MATCH_DATE_CALENDAR_JOIN',
              'selection_outcomes_read':False,
              'settlement_scored':False,
              'frozen_source_blob':EXPECTED_BLOB,
              'frozen_source_sha256':EXPECTED_SHA256,
              'pregame_candidates':len(ledger),
              'exact_dates_resolved':len(resolved),
              'unresolved':len(unresolved),
              'distinct_exact_candidate_dates':len(dates),
              'largest_exact_candidate_date_gaps':gaps[:20],
              'date_source_urls':source_urls,
              'guard':'Date source is used only to attach calendar dates to frozen candidate identities. Winner/score/odds never create, remove, rank or retune a T3 candidate. Non-unique joins remain UNRESOLVED.'
          }
          (OUT/'t3_exact_date_ledger.json').write_text(json.dumps(ledger,indent=2,ensure_ascii=False)+'\n')
          (OUT/'t3_exact_date_summary.json').write_text(json.dumps(summary,indent=2,ensure_ascii=False)+'\n')
          (OUT/'t3_unresolved.json').write_text(json.dumps(unresolved,indent=2,ensure_ascii=False)+'\n')
          print('KIRA_CALENDAR_SUMMARY', json.dumps(summary, sort_keys=True))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kira-tennis-exact-date-calendar
          path: artifacts/tennis_calendar
          if-no-files-found: warn
          retention-days: 30
