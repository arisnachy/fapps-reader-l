name: KIRA Juancito WNBA DST Widget V3

on:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_wnba_dst_widget_probe_v3.py'
      - '.github/workflows/kira-juancito-wnba-dst-widget-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Probe embedded WNBA props widget read-only
        run: python tools/kira_juancito_wnba_dst_widget_probe_v3.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-wnba-dst-widget-v3
          path: artifacts/kira_juancito_wnba_dst_widget_v3
          if-no-files-found: error
          retention-days: 7
