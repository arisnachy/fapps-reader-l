name: KIRA NBA B1 Ticket First DEV
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_nba_b1_ticket_first_lowest_total.py'
      - '.github/workflows/kira-nba-b1-ticket-first.yml'
permissions:
  contents: read
jobs:
  nba_b1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install science deps
        run: python -m pip install --disable-pip-version-check numpy pandas requests pyarrow
      - name: Run frozen prereg transfer DEV
        run: python tools/kira_nba_b1_ticket_first_lowest_total.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-nba-b1-ticket-first
          path: artifacts/kira_nba_b1_ticket_first_lowest_total
          if-no-files-found: error
          retention-days: 7
