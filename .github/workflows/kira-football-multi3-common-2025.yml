name: KIRA Football MULTI3 Common 2025

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_football_multi3_common_2025.py'
      - '.github/workflows/kira-football-multi3-common-2025.yml'

permissions:
  contents: read

jobs:
  common:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime
        run: python -m pip install --disable-pip-version-check requests
      - name: Execute outcome-blind modern MULTI3 coverage
        run: python tools/kira_football_multi3_common_2025.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: kira-football-multi3-common-2025
          path: artifacts/kira_football_multi3_common_2025
          if-no-files-found: error
          retention-days: 30
