name: KIRA Juancito Football Full Menu V4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_football_full_menu_v4.py'
      - '.github/workflows/kira-juancito-football-full-menu-v4.yml'
permissions:
  contents: read
jobs:
  full_menu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Traverse current public football menu read-only
        run: python tools/kira_juancito_football_full_menu_v4.py
      - uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-football-full-menu-v4
          path: artifacts/kira_juancito_football_full_menu_v4
          if-no-files-found: error
          retention-days: 7
