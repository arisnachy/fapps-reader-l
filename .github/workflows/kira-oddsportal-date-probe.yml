name: KIRA OddsPortal Date Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_oddsportal_date_probe.py'
      - '.github/workflows/kira-oddsportal-date-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check playwright
      - run: python -m playwright install chromium
      - run: python tools/kira_oddsportal_date_probe.py
