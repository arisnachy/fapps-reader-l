name: KIRA MLB SRL +2.5 Competitive Underdog V1

on:
  push:
    branches: [main]
    paths:
      - 'tools/kira_mlb_srlp25_competitive_underdog_v1.py'
      - '.github/workflows/kira-mlb-srlp25-competitive-underdog-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python -m py_compile tools/kira_mlb_srlp25_standings_gap_v1.py tools/kira_mlb_srlp25_competitive_underdog_v1.py
      - name: Execute DEV then sealed OOS only after DEV PASS
        working-directory: tools
        run: python kira_mlb_srlp25_competitive_underdog_v1.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kira-mlb-srlp25-competitive-underdog-v1
          path: tools/artifacts/kira_mlb_srlp25_competitive_underdog_v1
          if-no-files-found: error
          retention-days: 30
