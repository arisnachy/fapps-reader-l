name: KIRA Juancito MLB Super Run Line

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_mlb_srl_probe.py'
      - '.github/workflows/kira-juancito-mlb-srl.yml'

permissions:
  contents: read

jobs:
  mlb_srl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Capture current Super Run Line
        run: python tools/kira_juancito_mlb_srl_probe.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: kira-juancito-mlb-srl
          path: artifacts/kira_juancito_mlb_srl
          if-no-files-found: error
          retention-days: 7
