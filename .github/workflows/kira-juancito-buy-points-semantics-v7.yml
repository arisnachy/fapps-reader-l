name: KIRA Juancito Buy Points Semantics V7
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/kira_juancito_buy_points_semantics_v7.py'
      - '.github/workflows/kira-juancito-buy-points-semantics-v7.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Inspect public JS buy-points semantics
        run: python tools/kira_juancito_buy_points_semantics_v7.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kira-juancito-buy-points-semantics-v7
          path: artifacts/kira_juancito_buy_points_semantics_v7
          if-no-files-found: warn
          retention-days: 7
