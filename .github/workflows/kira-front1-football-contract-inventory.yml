name: KIRA FRONT1 Football Contract Inventory
on:
  push:
    paths:
      - '.github/workflows/kira-front1-football-contract-inventory.yml'
permissions:
  contents: write
jobs:
  summarize_frozen_snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Summarize already-persisted Football snapshot
        run: python kira_front1_summarize_football_actions.py | tee front1_football_actions_summary_stdout.json
      - name: Persist compact analysis
        run: |
          git config user.name 'kira-coverage-bot'
          git config user.email '127772990+arisnachy@users.noreply.github.com'
          git add front1_football_contract_inventory_v2/actions_summary.json front1_football_actions_summary_stdout.json
          git commit -m "KIRA FRONT1: summarize frozen Football action snapshot $GITHUB_RUN_ID"
          git push
