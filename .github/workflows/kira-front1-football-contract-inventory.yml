name: KIRA FRONT1 Football Contract Inventory
on:
  push:
    paths:
      - '.github/workflows/kira-front1-football-contract-inventory.yml'
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install anonymous browser runtime
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run DOM-backed anonymous Football contract probe v2
        run: python kira_front1_football_public_probe_v2.py | tee front1_football_probe_v2_stdout.json
      - name: Persist sanitized read-only evidence
        run: |
          git config user.name 'kira-coverage-bot'
          git config user.email '127772990+arisnachy@users.noreply.github.com'
          git add front1_football_contract_inventory_v2 front1_football_probe_v2_stdout.json
          git commit -m "KIRA FRONT1: public Football contract inventory v2 $GITHUB_RUN_ID"
          git push
